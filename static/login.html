<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Footprint Audit</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="login-body">
  <div class="card login-card">
    <div class="brand" style="margin-bottom:18px">
      <div class="mark">FA</div>
      <div>
        <h1 style="font-size:16px">Footprint Audit</h1>
        <p>Digital footprint self-audit</p>
      </div>
    </div>
    <h1>Sign in</h1>
    <p>Enter the app password to continue. This dashboard is for authorised self-audits only.</p>
    <form id="login-form">
      <input type="hidden" name="next" value="<!--NEXT-->" />
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <div class="actions">
        <button type="submit" class="primary">Continue</button>
      </div>
      <!--ERROR-->
      <div class="error" id="form-error"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById("login-form");
    const err = document.getElementById("form-error");
    const theme = localStorage.getItem("fa-theme");
    if (theme) document.documentElement.dataset.theme = theme;
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      err.style.display = "none";
      const body = new URLSearchParams();
      body.set("password", document.getElementById("password").value);
      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });
      if (res.ok) { window.location = "/"; return; }
      let msg = "Sign-in failed.";
      try { const data = await res.json(); if (data.detail) msg = data.detail; } catch (_) {}
      err.style.display = "block";
      err.textContent = msg;
    });
  </script>
</body>
</html>
