<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audit log · Footprint Audit</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <div class="mark">FA</div>
      <div>
        <h1>Footprint Audit</h1>
        <p>Audit log</p>
      </div>
    </div>
    <nav>
      <button type="button" class="icon-btn" id="theme-toggle">Dark</button>
      <a class="nav-link" href="/">New audit</a>
      <a class="nav-link" href="/logout">Log out</a>
    </nav>
  </header>
  <main>
    <div class="lede">
      <h2>Audit log</h2>
      <p>Recent scans on this instance. Identifiers are not stored — only input types, mode, and tools run.</p>
    </div>
    <section class="card">
      <div id="log"><p class="empty">Loading…</p></div>
    </section>
    <p class="page-footer">Educational self-audit. Public sources only. Not legal advice.</p>
  </main>
  <script>
    const THEME_KEY = "fa-theme";
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      document.getElementById("theme-toggle").textContent = theme === "dark" ? "Light" : "Dark";
      localStorage.setItem(THEME_KEY, theme);
    }
    applyTheme(localStorage.getItem(THEME_KEY) || "light");
    document.getElementById("theme-toggle").addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    function when(ts) {
      if (!ts) return "—";
      const d = new Date(/Z$|[+-]\d\d:\d\d$/.test(ts) ? ts : ts + "Z");
      if (Number.isNaN(d.getTime())) return String(ts);
      return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    }

    fetch("/api/audit").then(async (res) => {
      if (res.status === 401) { window.location = "/login"; return; }
      const data = await res.json();
      const rows = data.entries || [];
      const el = document.getElementById("log");
      if (!rows.length) { el.innerHTML = `<p class="empty">No scans recorded yet.</p>`; return; }
      el.innerHTML = `<div class="table-wrap"><table class="data">
        <thead><tr><th>When</th><th>Inputs</th><th>Mode</th><th>Tools</th></tr></thead>
        <tbody>
          ${rows.map((r) => `<tr>
            <td class="mono">${esc(when(r.timestamp))}</td>
            <td>${esc(Array.isArray(r.input_types) ? r.input_types.join(", ") : (r.input_types || "—"))}</td>
            <td>${r.is_demo ? "Demo" : "Live"}</td>
            <td class="tools">${esc((r.tools_run || "—").replaceAll(",", ", "))}</td>
          </tr>`).join("")}
        </tbody>
      </table></div>`;
    });
  </script>
</body>
</html>
